name: Update gallery manifest

on:
  push:
    branches: [main]
    paths:
      - "assets/images/services/**"
      - "scripts/generate-gallery-manifest.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-manifest-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate gallery manifest
        run: python scripts/generate-gallery-manifest.py

      - name: Commit updated manifest
        run: |
          if git diff --quiet -- assets/data/galleries.json; then
            echo "Gallery manifest is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/galleries.json
          git commit -m "chore: update gallery manifest"
          git push
